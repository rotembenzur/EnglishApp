    <script>
      (function () {
        try {
          var t = localStorage.getItem('lexbites.theme');
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
          var u = localStorage.getItem('lexbites.user');
          if (u === 'rotem' || u === 'noa') document.documentElement.dataset.user = u;
        } catch (e) {}
      })();
    </script>
