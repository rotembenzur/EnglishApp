name: Audio

# Pre-rendered pronunciation (Kokoro, see docs/DECISIONS.md, audio). On the default branch every
# content change renders only the new or changed clips, checks them with Whisper, updates the
# `audio-store` release and redeploys the site. On other branches it renders a small sample and
# uploads nothing, as a test of the pipeline.

on:
  push:
    paths:
      - 'content/shards/**'
      - 'content/curated/**'
      - 'scripts/audio/**'
      - 'src/audio/key.ts'
      - '.github/workflows/audio.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Render only this many items of each kind and publish nothing (0 = full run)'
        required: false
        default: '0'

permissions:
  contents: write
  actions: write

concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.ref_name == github.event.repository.default_branch && (inputs.limit == '' || inputs.limit == null || inputs.limit == '0') }}
  LIMIT: ${{ inputs.limit != '' && inputs.limit != null && inputs.limit || (github.ref_name == github.event.repository.default_branch && '0' || '12') }}
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Previous store
        run: |
          mkdir -p audio-old
          if [ "$LIMIT" = "0" ]; then
            gh release download audio-store -p store.json -D audio-old || echo "no store yet"
          fi
      - id: plan
        run: |
          pnpm exec tsx scripts/audio/plan.ts --store audio-old/store.json --out audio-work --limit "$LIMIT"
          echo "matrix=$(cat audio-work/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-work
          path: audio-work
          retention-days: 3

  render:
    name: Render ${{ matrix.chunk }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/audio/requirements.txt
      - run: pip install -r scripts/audio/requirements.txt
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: actions/cache@v4
        with:
          path: audio-models
          key: audio-models-kokoro-v1.0-whisper-base.en-small.en
      - name: Models
        run: |
          mkdir -p audio-models
          url=$(node -p "require('./scripts/audio/config.json').modelUrl")
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s "audio-models/$f" ] || curl -sSfL --retry 4 -o "audio-models/$f" "$url/$f"
          done
          ls -la audio-models
      - uses: actions/download-artifact@v4
        with:
          name: audio-work
          path: audio-work
      - name: Render, check and encode
        run: python scripts/audio/generate.py "audio-work/chunks/chunk-${{ matrix.chunk }}.json" "clips" audio-models
      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.chunk }}
          path: clips
          retention-days: 3

  assemble:
    name: Assemble and publish
    needs: [plan, render]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: audio-work
          path: audio-work
      - uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          path: audio-new
      - name: Previous store
        run: |
          mkdir -p audio-old audio-new
          if [ "$LIMIT" = "0" ]; then
            gh release download audio-store -D audio-old || echo "no store yet"
          fi
      - name: Assemble
        run: |
          pnpm exec tsx scripts/audio/assemble.ts --plan audio-work/plan.json --old audio-old --new audio-new --out audio-out/assets
          cat audio-out/assets/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the audio-store release
        if: env.PUBLISH == 'true'
        run: |
          if ! gh release view audio-store >/dev/null 2>&1; then
            gh release create audio-store --prerelease --title "Audio store (generated)" \
              --notes "Pre-rendered pronunciation for LexBites, built by the Audio workflow. Not a software release: the site deploy copies these files into GitHub Pages."
          fi
          cd audio-out/assets
          while read -r f; do
            [ -n "$f" ] && [ -f "$f" ] && echo "$f"
          done < ../upload.txt | xargs -r -n 20 gh release upload audio-store --clobber
          while read -r f; do
            [ -n "$f" ] && gh release delete-asset audio-store "$f" -y
          done < ../delete.txt
          echo "published"
      - name: Redeploy the site with the new audio
        if: env.PUBLISH == 'true'
        run: gh workflow run ci.yml --ref "${{ github.event.repository.default_branch }}"
      - name: Keep the test output
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: audio-test-output
          path: audio-out/assets
          retention-days: 3
